<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{WORLD}} map</title>
<meta property="og:title" content="{{WORLD}} map">
<meta property="og:description" content="{{ABOUT}}">
<meta property="og:image" content="{{IMAGE}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#071923">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/3.0.0/Control.FullScreen.min.css" integrity="sha256-7vzQ1UjjxHzI2q8ndZCxKoVMuk1Vu1AzRtRbGFd5/PY=" crossorigin="anonymous">
<style>
html,body{height:100%;margin:0;background:#071923;color:#eaf7fb;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
header{padding:12px 16px}
body.embed header{display:none}
h1{margin:0;font-size:20px}
p{margin:4px 0 0;color:#9fc2cf}
#chart{flex:1;min-height:0}
.key{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#9fc2cf}
.ramp{width:140px;height:10px;background:linear-gradient(90deg,#8fe9e4,#2b8fc4,#31408f,#27124f)}
.leaflet-container{background:#071923;font:inherit}
.leaflet-control-layers{color:#111}
</style>
</head>
<body>
<header>
<h1 id="title">{{WORLD}}</h1>
<p id="about"></p>
<div class="key"><span>Surface</span><span class="ramp"></span><span>Deep</span><span id="credit"></span></div>
</header>
<div id="chart"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/3.0.0/Control.FullScreen.min.js" integrity="sha256-RRgp0Apphsfcq2HCH06yN9MGixhRf/4qs11Cu6SJdOM=" crossorigin="anonymous"></script>
<script>
var TILE = 512, map, layers = {};
var stops = [[0, [143, 233, 228]], [100, [43, 143, 196]], [300, [49, 64, 143]], [800, [39, 18, 79]]];
if (new URLSearchParams(location.search).get('embed')) document.body.className = 'embed';
function colour(depth) {
  for (var i = 1; i < stops.length; i++) {
    if (depth <= stops[i][0]) {
      var a = stops[i - 1], b = stops[i], t = (depth - a[0]) / (b[0] - a[0]);
      return 'rgb(' + a[1].map(function (v, n) { return Math.round(v + (b[1][n] - v) * t); }).join(',') + ')';
    }
  }
  return 'rgb(39,18,79)';
}
// Fog of war: an opaque sheet over the view, so the map gives nothing away, with a soft round
// hole wherever someone has been; nearby visits melt into one clearing. Redrawn on every move; [lat, lng] points, radius in metres.
var Fog = L.Layer.extend({
  onAdd: function (m) {
    this._c = L.DomUtil.create('canvas', 'leaflet-zoom-animated', m.getPane('fog'));
    m.on('move zoom resize', this._draw, this).on('zoomanim', this._zoom, this); this._draw();
  },
  onRemove: function (m) { L.DomUtil.remove(this._c); m.off('move zoom resize', this._draw, this).off('zoomanim', this._zoom, this); },
  _zoom: function (e) {  // scale along with the picture while the zoom animates, redraw sharp at the end
    var m = this._map;
    L.DomUtil.setTransform(this._c, m._latLngBoundsToNewLayerBounds(this._bounds, e.zoom, e.center).min, m.getZoomScale(e.zoom));
  },
  set: function (pts, r) { this._pts = pts; this._r = r; if (this._map) this._draw(); },
  _draw: function () {
    var m = this._map, size = m.getSize(), c = this._c, g = c.getContext('2d'), r = this._r;
    c.width = size.x; c.height = size.y; this._bounds = m.getBounds();
    L.DomUtil.setPosition(c, m.containerPointToLayerPoint([0, 0]));
    g.fillStyle = '#071923'; g.fillRect(0, 0, size.x, size.y);
    g.globalCompositeOperation = 'destination-out';
    (this._pts || []).forEach(function (p) {
      var at = m.latLngToContainerPoint(p), px = Math.max(6, Math.abs(m.latLngToContainerPoint([p[0], p[1] + r]).x - at.x));  // still seen zoomed out
      if (at.x < -px || at.y < -px || at.x > size.x + px || at.y > size.y + px) return;
      var soft = g.createRadialGradient(at.x, at.y, px * 0.35, at.x, at.y, px);
      soft.addColorStop(0, 'rgba(0,0,0,1)'); soft.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = soft; g.beginPath(); g.arc(at.x, at.y, px, 0, 2 * Math.PI); g.fill();
    });
  }
});
// Latitude and longitude here are the game's y and x in metres, so markers need no
// conversion and the scale bar is true. Zoom 0 fits the background in one tile.
function setup(bgs) {
  var b = [0, 0, 3000, 3000], maxZoom = 8;
  if (bgs.length) {
    b = bgs[0].bounds.slice(); maxZoom = bgs[0].max_zoom + 1;
    bgs.forEach(function (g) { b[0] = Math.min(b[0], g.bounds[0], g.bounds[2]); b[2] = Math.max(b[2], g.bounds[0], g.bounds[2]);
      b[1] = Math.min(b[1], g.bounds[1], g.bounds[3]); b[3] = Math.max(b[3], g.bounds[1], g.bounds[3]); });
  }
  var s = TILE / Math.abs(bgs.length && bgs[0].tiles ? bgs[0].bounds[2] - bgs[0].bounds[0] : b[2] - b[0]);
  var t0 = bgs.length && bgs[0].tiles ? bgs[0].bounds : b, sy = t0[3] > t0[1] ? s : -s;
  var crs = L.extend({}, L.CRS.Simple, {transformation: new L.Transformation(s, -t0[0] * s, sy, -t0[1] * sy)});
  map = L.map('chart', {crs: crs, minZoom: -2, maxZoom: maxZoom, zoomSnap: 0.5, attributionControl: false, preferCanvas: true, fullscreenControl: true});
  L.control.scale({imperial: false, position: 'bottomleft'}).addTo(map);
  var hosts = [];
  bgs.forEach(function (g) {
    var area = [[g.bounds[1], g.bounds[0]], [g.bounds[3], g.bounds[2]]];
    if (g.tiles) L.tileLayer(g.url, {tileSize: TILE, minZoom: -2, maxZoom: g.max_zoom + 1, minNativeZoom: 0, maxNativeZoom: g.max_zoom, bounds: area}).addTo(map);
    else L.imageOverlay(g.url, area).addTo(map);
    if (/^https?:/.test(g.url)) { var h = new URL(g.url).hostname; if (hosts.indexOf(h) < 0) hosts.push(h); }
  });
  if (bgs.length) {
    map.fitBounds([[b[1], b[0]], [b[3], b[2]]]);
    map.setMinZoom(map.getZoom() - 1);  // no further out than the whole world, with room
    if (hosts.length) document.getElementById('credit').textContent = 'Background from ' + hosts.join(', ');
  }
  map.createPane('fog').style.zIndex = 350;  // over the picture, under the dots
  layers.fog = new Fog();
  if (bgs.length) layers.fog.addTo(map);
  layers.players = L.layerGroup().addTo(map);
  layers.bases = L.layerGroup().addTo(map);
  layers.lifepods = L.layerGroup().addTo(map);
  var shown = {'Players': layers.players, 'Bases': layers.bases, 'Lifepods': layers.lifepods};
  if (bgs.length) shown = L.extend({'Fog': layers.fog}, shown);
  L.control.layers(null, shown, {position: 'topright'}).addTo(map);
}
function pin(group, p, label, fill, faded) {
  var tag = document.createElement('span'); tag.textContent = label;  // a player's name is never HTML
  L.circleMarker([p[1], p[0]], {radius: 6, color: '#eaf7fb', weight: 2, fillColor: fill, fillOpacity: faded ? 0.4 : 1, opacity: faded ? 0.4 : 1})
    .bindTooltip(tag, {permanent: true, direction: 'right', offset: [8, 0]}).addTo(group);
}
function draw(d) {
  if (!map) setup(d.backgrounds || (d.background ? [d.background] : []));
  ['players', 'bases', 'lifepods'].forEach(function (k) { layers[k].clearLayers(); });
  var seen = [], h = d.cell_m / 2;
  layers.fog.set(d.explored.map(function (c) { return [c[1] + h, c[0] + h]; }), d.cell_m * 1.1);
  d.divers.forEach(function (p) {
    pin(layers.players, [p.x, p.y], p.name + (p.online ? ' · ' + p.depth + ' m' : ' · left ' + p.left_minutes + ' min ago'), colour(p.depth), !p.online);
    seen.push([p.y, p.x]);
  });
  d.lifepods.forEach(function (p) { pin(layers.lifepods, p, 'Lifepod', '#ff5a4f'); seen.push([p[1], p[0]]); });
  d.bases.forEach(function (p) { pin(layers.bases, p, 'Base', '#7ee787'); seen.push([p[1], p[0]]); });
  if (d.world) {
    document.title = d.world + ' map';
    document.getElementById('title').textContent = d.world;
  }
  document.getElementById('about').textContent = d.divers.length
    ? 'Where each player was about ' + d.delay_minutes + ' minutes ago. Never where they are now.'
    : 'Nobody has played here in the last hour. Players show up about ' + d.delay_minutes + ' minutes after they move.';
  var bare = !(d.backgrounds && d.backgrounds.length);
  if (!map.fitted && seen.length) {  // open where the action is; the whole world is one zoom out
    map.fitBounds(seen, {padding: [60, 60], maxZoom: bare ? 3 : 4});
    map.fitted = true;
  }
  if (bare && !map.fitted) map.setView([0, 0], 0);
}
function load() {
  fetch('map.json', {cache: 'no-store'}).then(function (r) { return r.json(); }).then(draw).catch(function () {});
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
