<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{WORLD}} map</title>
<meta property="og:title" content="{{WORLD}} map">
<meta property="og:description" content="{{ABOUT}}">
<meta property="og:image" content="{{IMAGE}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/4.0.0/Control.FullScreen.min.css" integrity="sha512-Dww58CIezLb4kFGtZ8Zlr85kRDwJgyPhe3gVABsvnJruZuYn3xCTpLbE3iBT5hGbrfCytJnZ4aiI3MxN0p+NVQ==" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" integrity="sha512-ENrTWqddXrLJsQS2A86QmvA17PkJ0GVm1bqj5aTgpeMAfDKN2+SIOLpKG8R/6KkimnhTb+VW5qqUHB/r1zaRgg==" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous">
<link rel="stylesheet" href="theme.css">
<style>
html,body,#chart{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:var(--size-small)/var(--leading) var(--font-text)}
header,.leaflet-bar a,.leaflet-control-layers,.leaflet-container .leaflet-control-attribution,.tag,.marker-cluster{background-color:var(--overlay);color:var(--text);border:var(--hair) solid var(--rule-strong)}
header{position:absolute;z-index:1000;top:0;left:0;width:min(var(--map-panel-width),calc(100% - var(--map-rail-reveal)));max-height:100%;overflow:auto;box-sizing:border-box;border-width:0 var(--hair) var(--hair) 0!important;backdrop-filter:blur(var(--overlay-blur))}
header:has(details[open]){bottom:0;border-bottom-width:0!important}
body.embed header{display:none}
summary{display:flex;align-items:baseline;gap:var(--gap-2);padding:var(--gap-3) var(--gap-4) var(--gap-2);border-bottom:var(--hair) solid var(--rule-strong);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:var(--size-lead)/1 var(--font-data);color:var(--dim)}
details[open] > summary::after{content:"−"}
h1{margin:0;font-size:var(--size-lead);font-weight:var(--weight-title);letter-spacing:var(--track-title);flex:1}
#behind{font:var(--size-tag) var(--font-data);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--beacon);white-space:nowrap}
#behind:empty,ul:empty,h2:has(+ ul:empty){display:none}
h2{margin:var(--gap-3) var(--gap-4) var(--gap-1);font:600 var(--size-tag) var(--font-data);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--faint)}
ul{margin:0;padding:0 var(--gap-2);list-style:none}
li{display:flex;align-items:center;gap:var(--gap-2);padding:var(--gap-1) var(--gap-2);border-radius:var(--edge);cursor:pointer}
li[hidden]{display:none}
li[data-kind="players"] .fa-solid{border-radius:50%}
body:has(header details[open]) .leaflet-bottom.leaflet-left{left:min(var(--map-panel-width),calc(100% - var(--map-rail-reveal)))}
#find{box-sizing:border-box;width:calc(100% - 2 * var(--gap-4));margin:var(--gap-3) var(--gap-4) 0;padding:var(--gap-1) var(--gap-2);border:var(--hair) solid var(--rule-strong);border-radius:var(--edge);background:var(--ink);color:var(--text);font:inherit}
#find:focus-visible{outline:var(--hair) solid var(--link);outline-offset:0}
li:hover,li.followed{background:var(--hull-2)}
li.faded{opacity:.55}
header .fa-solid{box-sizing:border-box;width:1.375rem;height:1.375rem;border-radius:var(--marker-edge);display:grid;place-items:center;font-size:var(--size-tag);flex:none}
li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li small{font:var(--size-meta) var(--font-data);color:var(--dim)}
header p{margin:var(--gap-3) var(--gap-4);font-size:var(--size-meta);color:var(--dim)}
.leaflet-container{background:var(--ink);font:inherit}
.leaflet-bar,.leaflet-bar a{border-radius:var(--edge)!important}
.leaflet-bar a:hover{background-color:var(--hull-2);color:var(--text)}
.leaflet-bar a.leaflet-disabled{background-color:var(--overlay);color:var(--faint)}
.leaflet-bar a.leaflet-fullscreen-icon{filter:invert(1);background-color:var(--text);border-color:var(--dim)}  /* its picture is dark, so the button is drawn in negative */
header .leaflet-control-layers{position:static;margin:0;padding:var(--gap-2) var(--gap-4);border:0;border-top:var(--hair) solid var(--rule-strong);background:none;box-shadow:none}
header .leaflet-control-layers-overlays{display:flex;flex-wrap:wrap;gap:var(--gap-1) var(--gap-4)}
.leaflet-control-layers label{font:var(--size-tag) var(--font-data);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--dim)}
.leaflet-control-layers input{accent-color:var(--link);border-radius:0;margin:0 var(--gap-1) 0 0}
.leaflet-container .leaflet-control-attribution{border:0;color:var(--dim)}
.leaflet-control-scale-line{background:none;color:var(--text);border-color:var(--text);border-width:var(--edge);font:600 var(--size-small) var(--font-data);line-height:1.5;text-shadow:0 0 4px var(--ink)}
.pin{cursor:pointer}
.pin.followed i{border-color:var(--beacon);box-shadow:0 0 0 4px var(--beacon)}
.pin i{box-sizing:border-box;width:var(--marker-size);height:var(--marker-size);border:var(--edge) solid var(--text);border-radius:var(--marker-edge);display:grid;place-items:center;font-size:calc(var(--marker-size) * 0.46);box-shadow:var(--marker-shadow)}
.pin.player i{border-radius:50%}
.tag{border-radius:var(--edge);padding:0 var(--gap-2);font:var(--size-meta) var(--font-data);box-shadow:none;white-space:nowrap}
.tag::before{display:none}
.marker-cluster{border:var(--edge) solid var(--beacon);border-radius:var(--marker-edge);display:grid;place-items:center;font:600 var(--size-small) var(--font-data);box-shadow:var(--marker-shadow)}
</style>
</head>
<body>
<header><details id="card" open>
<summary><h1 id="title">{{WORLD}}</h1><span id="behind"></span></summary>
<input id="find" type="search" placeholder="Find a player or place" aria-label="Find a player or place">
<h2>Players</h2><ul id="players"></ul>
<h2>Places</h2><ul id="places"></ul>
<p id="about"></p>
</details></header>
<div id="chart"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/4.0.0/Control.FullScreen.min.js" integrity="sha512-javanlE101qSyZ7XdaJMpB/RnKP4S/8jq1we4sy50BfBgXlcVbIJ5LIOyVa2qqnD+aGiD7J6TQ4bYKnL1Yqp5g==" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js" integrity="sha512-TiMWaqipFi2Vqt4ugRzsF8oRoGFlFFuqIi30FFxEPNw58Ov9mOy6LgC05ysfkxwLE0xVeZtmr92wVg9siAFRWA==" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.featuregroup.subgroup@1.0.2/dist/leaflet.featuregroup.subgroup.js" integrity="sha256-lTN8BYPNcvhjd8DFDOWPtNbYWcQEz94SPEYHCaEDl7k=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.4.2/chroma.min.js" integrity="sha512-zInFF17qBFVvvvFpIfeBzo7Tj7+rQxLeTJDmbxjBz5/zIr89YVbTNelNhdTT+/DCrxoVzBeUPVFJsczKbB7sew==" crossorigin="anonymous"></script>
<script>
var TILE = 512, map, layers = {}, shown = {}, trail = [], lock;
// The address carries the view, so a copied link opens the same place: #x=..&y=..&z=.. in game metres and zoom,
// hide=fog,signals for layers switched off, follow=a player's name to keep the map on them.
var link = new URLSearchParams(location.hash.slice(1)), follow = link.get('follow') || '';
var css = getComputedStyle(document.documentElement);
function token(name) { return css.getPropertyValue('--' + name).trim(); }  // a value from theme.css
var SIZE = parseFloat(token('marker-size')) || 30;  // the markers' size in pixels, for Leaflet's hit areas
var colour = chroma.scale([token('depth-0'), token('depth-100'), token('depth-300'), token('depth-800')]).domain([0, 100, 300, 800]);  // a player's colour, by depth in metres
if (innerWidth < 600) document.getElementById('card').open = false;  // on a phone the map comes first
if (new URLSearchParams(location.search).get('embed')) document.body.className = 'embed';
function text(s) { var e = document.createElement('span'); e.textContent = s; return e; }  // names and credits are never HTML
// Fog of war: an opaque sheet over the view, so the map gives nothing away, with a soft round
// hole wherever someone has been; nearby visits melt into one clearing. Redrawn on every move; [lat, lng] points, radius in metres.
var Fog = L.Layer.extend({
  onAdd: function (m) {
    this._c = L.DomUtil.create('canvas', 'leaflet-zoom-animated', m.getPane('fog'));
    m.on('move zoom resize', this._draw, this).on('zoomanim', this._zoom, this); this._draw();
  },
  onRemove: function (m) { L.DomUtil.remove(this._c); m.off('move zoom resize', this._draw, this).off('zoomanim', this._zoom, this); },
  _zoom: function (e) {  // scale along with the picture while the zoom animates, redraw sharp at the end
    var m = this._map;
    L.DomUtil.setTransform(this._c, m._latLngBoundsToNewLayerBounds(this._bounds, e.zoom, e.center).min, m.getZoomScale(e.zoom));
  },
  set: function (pts, r) { this._pts = pts; this._r = r; if (this._map) this._draw(); },
  _draw: function () {
    var m = this._map, size = m.getSize(), c = this._c, g = c.getContext('2d'), r = this._r;
    c.width = size.x; c.height = size.y; this._bounds = m.getBounds();
    L.DomUtil.setPosition(c, m.containerPointToLayerPoint([0, 0]));
    g.fillStyle = token('ink'); g.fillRect(0, 0, size.x, size.y);
    g.globalCompositeOperation = 'destination-out';
    (this._pts || []).forEach(function (p) {
      var at = m.latLngToContainerPoint(p), px = Math.max(6, Math.abs(m.latLngToContainerPoint([p[0], p[1] + r]).x - at.x));  // still seen zoomed out
      if (at.x < -px || at.y < -px || at.x > size.x + px || at.y > size.y + px) return;
      var soft = g.createRadialGradient(at.x, at.y, px * 0.35, at.x, at.y, px);
      soft.addColorStop(0, 'rgba(0,0,0,1)'); soft.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = soft; g.beginPath(); g.arc(at.x, at.y, px, 0, 2 * Math.PI); g.fill();
    });
  }
});
// With no background picture: a line every --grid-step-m metres in the --grid colour, thinned out
// when zoomed far out so lines never come closer than 24 pixels.
var Grid = L.GridLayer.extend({
  createTile: function (at) {
    var tile = L.DomUtil.create('canvas'), size = this.getTileSize(), g = tile.getContext('2d');
    tile.width = size.x; tile.height = size.y;
    var a = this._map.unproject(at.scaleBy(size), at.z), z = this._map.unproject(at.add([1, 1]).scaleBy(size), at.z);
    var step = Number(token('grid-step-m')) || 100, span = Math.abs(z.lng - a.lng) || 1;
    while (step / span * size.x < 24) step *= 2;
    g.strokeStyle = token('grid'); g.lineWidth = 1;
    function lines(from, to, across) {
      for (var v = Math.ceil(Math.min(from, to) / step) * step; v <= Math.max(from, to); v += step) {
        var px = Math.round((v - from) / (to - from) * (across ? size.y : size.x)) + 0.5;
        g.beginPath();
        if (across) { g.moveTo(0, px); g.lineTo(size.x, px); } else { g.moveTo(px, 0); g.lineTo(px, size.y); }
        g.stroke();
      }
    }
    lines(a.lng, z.lng, false); lines(a.lat, z.lat, true);
    return tile;
  }
});
// Latitude and longitude here are the game's y and x in metres, so markers need no
// conversion and the scale bar is true. Zoom 0 fits the background in one tile.
function setup(bgs) {
  var b = [0, 0, 3000, 3000], maxZoom = 8;
  if (bgs.length) {
    b = bgs[0].bounds.slice(); maxZoom = bgs[0].max_zoom + 1;
    bgs.forEach(function (g) { b[0] = Math.min(b[0], g.bounds[0], g.bounds[2]); b[2] = Math.max(b[2], g.bounds[0], g.bounds[2]);
      b[1] = Math.min(b[1], g.bounds[1], g.bounds[3]); b[3] = Math.max(b[3], g.bounds[1], g.bounds[3]); });
  }
  var s = TILE / Math.abs(bgs.length && bgs[0].tiles ? bgs[0].bounds[2] - bgs[0].bounds[0] : b[2] - b[0]);
  var t0 = bgs.length && bgs[0].tiles ? bgs[0].bounds : b, sy = t0[3] > t0[1] ? s : -s;
  var crs = L.extend({}, L.CRS.Simple, {transformation: new L.Transformation(s, -t0[0] * s, sy, -t0[1] * sy)});
  map = L.map('chart', {crs: crs, minZoom: -2, maxZoom: maxZoom, zoomSnap: 0.5, zoomControl: false,
    fullscreenControl: true, fullscreenControlOptions: {position: 'bottomright'}});
  map.attributionControl.setPrefix(false);
  L.control.zoom({position: 'bottomright'}).addTo(map);
  L.control.scale({imperial: false, maxWidth: 220, position: 'bottomleft'}).addTo(map);
  bgs.forEach(function (g) {
    var area = [[g.bounds[1], g.bounds[0]], [g.bounds[3], g.bounds[2]]];
    var credit = text(g.credit ? 'Map picture: ' + g.credit : /^https?:/.test(g.url) ? 'Background from ' + new URL(g.url).hostname : '').innerHTML;
    if (g.tiles) L.tileLayer(g.url, {tileSize: TILE, minZoom: -2, maxZoom: g.max_zoom + 1, minNativeZoom: 0, maxNativeZoom: g.max_zoom, bounds: area, attribution: credit}).addTo(map);
    else L.imageOverlay(g.url, area, {attribution: credit}).addTo(map);
  });
  if (!bgs.length) new Grid({tileSize: TILE, minZoom: -2, maxZoom: maxZoom}).addTo(map);  // a chart, not a void
  if (bgs.length) {
    map.fitBounds([[b[1], b[0]], [b[3], b[2]]]);
    map.setMinZoom(map.getZoom() - 1);  // no further out than the whole world, with room
  }
  map.createPane('fog').style.zIndex = 350;  // over the picture, under the markers
  layers.fog = new Fog();
  if (bgs.length) layers.fog.addTo(map);
  // Markers that would sit on top of each other merge into one numbered marker; hovering it names them, a click zooms in.
  var near = L.markerClusterGroup({maxClusterRadius: 80, showCoverageOnHover: false, iconCreateFunction: function (c) {
    return L.divIcon({className: 'marker-cluster', iconSize: [SIZE + 4, SIZE + 4], html: String(c.getChildCount())});
  }}).addTo(map);
  near.on('clustermouseover', function (e) {
    e.layer.bindTooltip(text(e.layer.getAllChildMarkers().map(function (m) { return m.options.label; }).join(' \u00b7 ')), {className: 'tag', direction: 'bottom', offset: [0, 14]}).openTooltip();
  });
  if (bgs.length) shown.Fog = layers.fog;
  ['Players', 'Lifepods', 'Signals'].forEach(function (k) { shown[k] = layers[k.toLowerCase()] = L.featureGroup.subGroup(near).addTo(map); });
  layers.followed = L.layerGroup().addTo(map);  // outside the merging, so the player being followed is not hidden in a numbered marker
  map.on('overlayadd overlayremove', function (e) { if (e.layer === layers.players) map[e.type === 'overlayadd' ? 'addLayer' : 'removeLayer'](layers.followed); });
  var switches = L.control.layers(null, shown, {position: 'topright', collapsed: false}).addTo(map);
  document.getElementById('card').appendChild(switches.getContainer());  // docked in the panel, not floating in a corner
  (link.get('hide') || '').split(',').forEach(function (k) { k = k.charAt(0).toUpperCase() + k.slice(1); if (shown[k]) map.removeLayer(shown[k]); });
  var at = ['y', 'x', 'z'].map(function (k) { return link.get(k) ? Number(link.get(k)) : NaN; });
  if (at.every(isFinite)) { map.setView([at[0], at[1]], at[2]); map.fitted = true; }
  map.on('moveend overlayadd overlayremove', share);
}
function share() {
  var c = map.getCenter(), q = new URLSearchParams({x: Math.round(c.lng), y: Math.round(c.lat), z: map.getZoom()});
  var hide = Object.keys(shown).filter(function (k) { return !map.hasLayer(shown[k]); }).join(',').toLowerCase();
  if (hide) q.set('hide', hide);
  if (follow) q.set('follow', follow);
  history.replaceState(null, '', '#' + q);
}
function pin(kind, p, label, note, icon, fill, faded, mark) {
  var glyph = '<i class="fa-solid fa-' + icon + '" style="background:' + fill + ';color:' + (chroma(fill).luminance() > 0.3 ? token('ink') : token('text')) + '"></i>';
  var m = L.marker([p[1], p[0]], {label: label, opacity: faded ? 0.5 : 1, icon: L.divIcon({className: 'pin' + (kind === 'players' ? ' player' : '') + (mark ? ' followed' : ''), iconSize: [SIZE, SIZE], html: glyph})})
    .bindTooltip(text(note ? label + ' \u00b7 ' + note : label), {permanent: true, direction: 'bottom', offset: [0, 14], className: 'tag', opacity: faded ? 0.6 : 1})
    .on('click', function () { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 6)); }).addTo(mark ? layers.followed : layers[kind]);
  var row = document.createElement('li'), small = document.createElement('small');
  row.className = (faded ? 'faded ' : '') + (mark ? 'followed' : ''); row.dataset.kind = kind;
  row.innerHTML = glyph; row.appendChild(text(label)); small.textContent = note; row.appendChild(small);
  row.onclick = function () { m.fire('click'); };
  document.getElementById(kind === 'players' ? 'players' : 'places').appendChild(row);
  return m;
}
var find = document.getElementById('find');
function sift() {  // the card's rows narrowed to what is typed; the map keeps every marker
  var q = find.value.trim().toLowerCase();
  [].forEach.call(document.querySelectorAll('header li'), function (row) { row.hidden = row.textContent.toLowerCase().indexOf(q) < 0; });
}
find.oninput = sift;
function draw(d) {
  every = d.refresh_seconds || 60;
  if (!map) setup(d.backgrounds || (d.background ? [d.background] : []));
  ['players', 'lifepods', 'signals', 'followed'].forEach(function (k) { layers[k].clearLayers(); });
  ['players', 'places'].forEach(function (k) { document.getElementById(k).textContent = ''; });
  var seen = [], crowd = [], found = false, h = d.cell_m / 2, pods = d.lifepods.map(String);
  if (d.explored) {
    layers.fog.set(d.explored.map(function (c) { return [c[1] + h, c[0] + h]; }), d.cell_m * 1.1);
    if (layers.fogHeld) { layers.fog.addTo(map); layers.fogHeld = false; }
  } else if (map.hasLayer(layers.fog)) { map.removeLayer(layers.fog); layers.fogHeld = true; }  // nothing explored is published
  d.divers.forEach(function (p) {
    var here = [p.y, p.x];
    if (p.name === follow) {  // their path, as far as this open page has seen it
      found = true;
      if (String(trail[trail.length - 1]) !== String(here)) trail = trail.concat([here]).slice(-240);
      L.polyline(trail, {color: token('text'), weight: 2, opacity: 0.6, dashArray: '2 6', interactive: false}).addTo(layers.followed);
    }
    pin('players', [p.x, p.y], p.name, p.online ? p.depth + ' m' : 'left ' + p.left_minutes + ' min ago', 'person-swimming', colour(p.depth).hex(), !p.online, p.name === follow)
      .off('click').on('click', function () { follow = follow === p.name ? '' : p.name; trail = []; draw(d); share(); });
    if (p.name === follow) { if (map.fitted) map.panTo(here); else map.setView(here, 5); map.fitted = true; }
    seen.push(here); crowd.push(here);
  });
  d.lifepods.forEach(function (p) { pin('lifepods', p, 'Lifepod', '', 'life-ring', token('life')); seen.push([p[1], p[0]]); });
  (d.signals || []).forEach(function (p) {
    if (pods.indexOf(p[0] + ',' + p[1]) < 0) pin('signals', p, p[2], '', 'tower-broadcast', token('beacon'));  // a lifepod's own signal is drawn as the lifepod
    seen.push([p[1], p[0]]);
  });
  if (d.world) {
    document.title = d.world + ' map';
    document.getElementById('title').textContent = d.world;
  }
  if (!found) trail = [];
  // While following, the browser is asked to keep the screen on; it lets go by itself when the page is hidden, so it is asked again at the next check.
  if (follow && navigator.wakeLock && !(lock && !lock.released)) navigator.wakeLock.request('screen').then(function (l) { lock = l; }, function () {});
  if (!follow && lock) { lock.release(); lock = null; }
  document.getElementById('behind').textContent = d.explored !== null && d.delay_minutes ? d.delay_minutes + ' min behind' : '';
  document.getElementById('about').textContent = (d.explored === null ? 'Player positions are not shown on this map.'
    : !d.divers.length ? 'No player positions to show yet.' + (d.delay_minutes ? ' They appear about ' + d.delay_minutes + ' minutes after someone moves.' : '')
    : (d.delay_minutes ? 'Players are shown where they were about ' + d.delay_minutes + ' minutes ago. ' : 'Players are shown at their last recorded position. ')
      + (follow ? 'Following ' + follow + '; click them to stop.' : 'Click one to follow them.'))
    + ' Updated ' + new Date(d.updated * 1000).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})
    + ', checked every ' + every + ' seconds. Anyone with this link sees this page and its data.';
  sift();
  var bare = !(d.backgrounds && d.backgrounds.length);
  if (!map.fitted && seen.length) {  // open on the players, or with none on everything marked
    // Keep what it opens on clear of the panel: a rail on the left while open, a bar along the top while closed.
    var head = document.querySelector('header'), open = document.getElementById('card').open;
    map.fitBounds(crowd.length ? crowd : seen, {paddingTopLeft: [(open ? head.offsetWidth : 0) + 60, (open ? 0 : head.offsetHeight) + 60],
      paddingBottomRight: [60, 60], maxZoom: bare ? 3 : 5});
    map.fitted = true;
  }
  if (bare && !map.fitted) map.setView([0, 0], 0);
}
var every = 60;  // seconds between checks; map.json says how often (MAP_REFRESH_SECONDS)
function load() {
  fetch('map.json', {cache: 'no-store'}).then(function (r) { if (!r.ok) throw r.status; return r.json(); }).then(draw)
    .catch(function () { document.getElementById('about').textContent = 'Map data unavailable right now; trying again in ' + every + ' seconds.'; })
    .then(function () { setTimeout(load, every * 1000); });
}
load();
</script>
</body>
</html>
