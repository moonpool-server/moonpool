# The Discord card's wording. Copy this file to card.yaml in the data volume and change
# any line; a line you leave out keeps the shipped wording. {placeholders} are filled
# by name, only the ones a line shows. Markdown as Discord reads it. Up to 400 characters.
#   docker compose cp card.yaml sn2:/home/container/card.yaml

aboard_title: "**Aboard**"
nobody_aboard: "Nobody aboard right now."
# placeholders: {when}
last_aboard: " Last aboard {when}."
# placeholders: {min}
not_hosting: "The game has run for {min} min without opening its world. Nobody can join until it does."
# Added under not_hosting when the mod loader crashed during this game run.
loader_crashed: >-
  The mod loader wrote a crash report during this run before its mods started. That usually means
  it doesn't fit this game build; the host's guide covers this under Updates.
# placeholders: {scans}
scanned: "Scanned lately: {scans}"
# placeholders: {n}, {url}
mods: >-
  • **Mods** ({n}): press **Join**, then **Play with mods** on the [page]({url}/join). It installs
  them at the server's versions and joins
# placeholders: {url}
how_to_join: "**How to join**: step by step on the [join page]({url}/join)"
# Shown on a beta branch. placeholders: {branch}, {accepts}
steam_beta: "-# Steam: first pick **{branch}** in Subnautica 2 › **Properties** › **Betas**. Friend requests: {accepts}"
# Shown on the public branch. placeholders: {accepts}
steam_add: "-# Steam: add the host with its code above. Friend requests: {accepts}"
accepts_auto: "accepted within a minute"
accepts_invite: "an admin invites you first"
accepts_manual: "the host accepts them by hand"
# placeholders: {n}
friend_requests: "-# Friend requests waiting for the host: {n}"
# placeholders: {beta} (xbox_beta on a beta branch, else nothing)
xbox_add: "-# Xbox / Game Pass: {beta}add the host's Xbox code in the game's **Friends** menu"
xbox_beta: "the Subnautica 2 preview in **Xbox Insider Hub**, then "
# A small line under the steps: a tip, or your house rules.
tip: >-
  -# Tip: turn on background audio in the game's audio settings, so voice keeps playing when you
  alt-tab
footer: "-# Unofficial and not affiliated with Unknown Worlds, KRAFTON or Valve"
